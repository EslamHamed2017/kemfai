# KEMFAI dev environment - Odoo Community 18 + PostgreSQL 16
# Dev only. Production runs on a separate VPS with per-tenant DBs.

services:
  kemfai-db:
    image: postgres:16
    container_name: kemfai-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: kemfai_dev_pg
      POSTGRES_DB: postgres
    volumes:
      - kemfai-db-data:/var/lib/postgresql/data
      - ./init-control-db.sh:/docker-entrypoint-initdb.d/init-control-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kemfai-odoo:
    image: odoo:18
    container_name: kemfai-odoo
    depends_on:
      kemfai-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8069"
    environment:
      HOST: kemfai-db
      USER: odoo
      PASSWORD: kemfai_dev_pg
    volumes:
      - kemfai-odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ../../backend/addons:/mnt/extra-addons
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kemfai-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: kemfai-minio
    environment:
      MINIO_ROOT_USER: kemfai_minio
      MINIO_ROOT_PASSWORD: kemfai_dev_minio_secret
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kemfai-minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kemfai-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: kemfai_dev_admin
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_ORIGIN:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ../../backend/api
    container_name: kemfai-api
    depends_on:
      kemfai-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      KEMFAI_ODOO_URL: http://kemfai-odoo:8069
      KEMFAI_ODOO_MASTER_PASSWORD: ${KEMFAI_ODOO_MASTER_PASSWORD:?Set Odoo master password}
      KEMFAI_TENANT_ADMIN_LOGIN: ${KEMFAI_TENANT_ADMIN_LOGIN:?Set tenant admin login}
      KEMFAI_TENANT_ADMIN_PASSWORD: ${KEMFAI_TENANT_ADMIN_PASSWORD:?Set tenant admin password}
      KEMFAI_BANK_TRANSFER_INSTRUCTIONS_EN: ${KEMFAI_BANK_TRANSFER_INSTRUCTIONS_EN:?Set owner-provided English bank transfer instructions}
      KEMFAI_BANK_TRANSFER_INSTRUCTIONS_AR: ${KEMFAI_BANK_TRANSFER_INSTRUCTIONS_AR:?Set owner-provided Arabic bank transfer instructions}
      # No production default is permitted. Owner/security approval must choose the finite
      # positive ceiling; empty/unset is passed through so grant creation fails closed.
      SUPPORT_ACCESS_MAX_DURATION_HOURS: ${SUPPORT_ACCESS_MAX_DURATION_HOURS:-}
      KEYCLOAK_URL: http://keycloak:8080
      # Tokens minted through either browser or backchannel carry this one canonical issuer.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/kemfai-customers}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/kemfai-customers/protocol/openid-connect/certs
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-kemfai-api}
      STORAGE_ENDPOINT: http://minio:9000
      # T025: must match the minio service's MINIO_ROOT_USER/MINIO_ROOT_PASSWORD above —
      # the API/BFF's own service credentials are the only credentials ever allowed to
      # reach a tenant bucket (research.md §5).
      STORAGE_ACCESS_KEY: kemfai_minio
      STORAGE_SECRET_KEY: kemfai_dev_minio_secret
      CONTROL_DB_HOST: kemfai-db
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_USER: kemfai_api
      CONTROL_DB_PASSWORD: ${CONTROL_DB_APP_PASSWORD:-kemfai_api_dev}
      CONTROL_DB_NAME: kemfai_control
      # T022: the BFF serves specs/001-saas-onboarding-shell/contracts/openapi.yaml
      # verbatim; mount it read-only rather than copying it into the image (single
      # source of truth — no second copy to drift).
      OPENAPI_CONTRACT_PATH: /kemfai-specs/001-saas-onboarding-shell/contracts/openapi.yaml
    volumes:
      - ../../specs:/kemfai-specs:ro
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
    container_name: kemfai-frontend
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEFAULT_LOCALE: en
      # T039: public issuer/redirect are browser-visible; the backchannel stays on the
      # compose network. Tokens are exchanged server-side and stored only in Redis.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/kemfai-customers}
      KEYCLOAK_BACKCHANNEL_URL: http://keycloak:8080/realms/kemfai-customers
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/kemfai-customers/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-kemfai-api}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:3010/auth/callback}
      KEMFAI_API_URL: http://api:4000
      REDIS_URL: redis://redis:6379
      # T037 duplicate-email recovery actions (/login, /reset-password route handlers).
      # Unset in dev on purpose - the handlers fall back to a localized "temporarily
      # unavailable" message rather than a dead link when these are empty.
      KEYCLOAK_CUSTOMERS_LOGIN_URL: ${KEYCLOAK_CUSTOMERS_LOGIN_URL:-}
      KEYCLOAK_CUSTOMERS_RESET_PASSWORD_URL: ${KEYCLOAK_CUSTOMERS_RESET_PASSWORD_URL:-}
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kemfai-db-data:
  kemfai-odoo-data:
  kemfai-minio-data:
